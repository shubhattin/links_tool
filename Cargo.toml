[package]
name = "links_tool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vercel_runtime = { version = "2", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"
sea-orm = { version = "1.1", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
sea-query = { version = "0.32", default-features = false, features = [
    "backend-postgres",
    "derive",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "postgres",
    "runtime-tokio-rustls",
] }

[dev-dependencies]
colored = "3"
serde_json = "1"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "api"
path = "api/api.rs"

[workspace]
members = ["migration"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
